[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probedatatools"
version = "0.1.0"
description = "Tools for processing electron-microprobe analyses and mineral compositions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Felix Boschetty"},
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probedatatools = ["oxides.csv"]