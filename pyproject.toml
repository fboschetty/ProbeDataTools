[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probedatatools"
version = "0.1.0"
description = "Tools for processing electron-microprobe analyses and mineral compositions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Felix Boschetty"},
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://github.com/fboschetty/ProbeDataTools"
Repository = "https://github.com/fboschetty/ProbeDataTools"
Issues = "https://github.com/fboschetty/ProbeDataTools/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probedatatools = ["species.csv"]